# Deploys each extension's static build to its Cloudflare Pages project when
# its directory changes on main. To add an extension: add its directory to
# `paths` and a row to the matrix. Requires the repo secrets
# CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy extensions

on:
  push:
    branches: [main]
    paths:
      - "mkp-lorebook-builder/**"
      - ".github/workflows/deploy-extensions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-extensions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: mkp-lorebook-builder
            project: mkp-lorebook-builder
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Only rebuild the extensions whose directory actually changed in this
      # push. A manual dispatch deploys every row of the matrix.
      - name: Detect changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- . ; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install
        if: steps.changed.outputs.run == 'true'
        run: npm ci

      - name: Build
        if: steps.changed.outputs.run == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.changed.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name="${{ matrix.project }}"
          --branch=main
          --commit-hash="${{ github.sha }}"
          --commit-dirty=false
